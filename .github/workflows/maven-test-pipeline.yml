name: Java Maven Tests CI

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    name: Run ${{ matrix.test-group }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-group: ["smoke", "regression"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        # Adding English comments to code
        run: mvn test -Dgroups="${{ matrix.test-group }}" -Dselenide.headless=true
        continue-on-error: true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-group }}
          path: target/allure-results

  generate-and-deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-results
          merge-multiple: true

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -zxf allure-2.32.0.tgz
          sudo ln -s $(pwd)/allure-2.32.0/bin/allure /usr/bin/allure

      - name: Generate Report
        run: allure generate all-results -o allure-report-dir --clean

      - name: Deploy to GitHub Pages
        # Using peaceiris action which is more stable for branch-based deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report-dir